# Dashboard (T12) servido pelo nginx; /api, /metrics e /health vão para o serviço api na rede do compose (T16).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver do Docker: resolve "api" a cada requisição (o container da api pode ser recriado).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location ~ ^/(api|metrics|health)(/|$) {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # T17: SOBRESCREVE (não anexa) com o IP real; a API confia nesse valor (TRUST_PROXY) no limite de login.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # ---- Integração CRM ---------------------------------------------------------------------------------------
  # Serve o CRM no mesmo origin do painel (página #/crm, SSO por /api/crm/sso) com os serviços do docker-compose.crm.yml
  # (crm-api na porta 3000 da rede do compose; crm-web = nginx com o build do CRM feito com base /crm/). Com variáveis
  # (resolvidas a cada requisição pelo resolver acima) o nginx sobe mesmo sem os containers do CRM: sem eles, /crm/ dá
  # 502 e a página CRM mostra "Integração CRM desligada" (sem CRM_SSO_SECRET na API).

  location /crm/api/ {
    set $crm_api_upstream http://crm-api:3000;
    # A API do CRM não conhece o prefixo: /crm/api/x → /api/x.
    rewrite ^/crm(/api/.*)$ $1 break;
    proxy_pass $crm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (eventos em tempo real do CRM) sem buffer.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /crm/ {
    set $crm_web_upstream http://crm-web:80;
    # O crm-web serve o build (base /crm/) na raiz: /crm/x → /x.
    rewrite ^/crm/(.*)$ /$1 break;
    proxy_pass $crm_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA: rotas do cliente caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
