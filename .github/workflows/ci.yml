name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
  workflow_call:

jobs:
  qr-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wsm
          POSTGRES_PASSWORD: wsm
          POSTGRES_DB: wsm
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U wsm -d wsm" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://wsm:wsm@127.0.0.1:5432/wsm
      REDIS_URL: redis://127.0.0.1:6379
      NODE_OPTIONS: --conditions=development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wsm/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @wsm/dashboard build
      - name: Mobile, desktop, reconnect, failures and authentication (fake WhatsApp)
        run: >-
          pnpm exec vitest run --config tests/acceptance/vitest.config.ts
          tests/acceptance/T18/qr-recovery.test.ts
          tests/acceptance/T12/sessions.test.ts
          tests/acceptance/T18/new-session.test.ts
          tests/acceptance/T21/chips-crm-design.test.ts
          tests/acceptance/T12/auth.test.ts
          tests/acceptance/T12/privacy-policy.test.ts
          tests/acceptance/T18/login.test.ts
          tests/acceptance/T18/persistent-login.test.ts
          --reporter=json --outputFile=qr-ui-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-ui-verification-${{ github.sha }}
          path: qr-ui-results.json
          if-no-files-found: warn
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wsm
          POSTGRES_PASSWORD: wsm
          POSTGRES_DB: wsm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wsm -d wsm"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://wsm:wsm@localhost:5432/wsm
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/test-deploy-vps.sh
      - run: node --test scripts/crm-release/release.test.mjs
      - run: node --test scripts/crm-release/prepare-ci-tests.test.mjs
      - run: node --test scripts/crm-release/tsx-conditions.test.mjs
      - run: node --test scripts/auth/live-login-transport.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  crm-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wsm
          POSTGRES_PASSWORD: wsm
          POSTGRES_DB: wsm
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U wsm -d wsm" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://wsm:wsm@127.0.0.1:5432/wsm
      REDIS_URL: redis://127.0.0.1:6379/1
      NODE_OPTIONS: --conditions=development
      SHARED_OFFERS_COMPANY_ID: ''
      AI_MODE: fake
      WA_TRANSPORT: fake
      WA_GATEWAY: fake
      PANEL_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CRM temporary paths
        shell: bash
        run: |
          printf 'CRM_REPORT_DIR=%s/crm-reports\nCRM_EMBEDDED_DIST=%s/crm-embedded\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reconstruct the approved sanitized CRM (no operator sources)
        run: |
          mkdir -p "$CRM_REPORT_DIR" "$RUNNER_TEMP/output/shared-offers"
          node scripts/prepare-shared-offers-crm.mjs "$RUNNER_TEMP/crm-source"
          test "$(git -C "$RUNNER_TEMP/crm-source" write-tree)" = 964db6c2b47e33e9526d5cc890d6842ab98fdb0a
      - name: Install and build test dependencies on the runner only
        run: |
          diag() { node "$GITHUB_WORKSPACE/scripts/crm-release/listener-diagnostic.mjs" "$RUNNER_TEMP/crm-source" "$CRM_REPORT_DIR" "$@"; }
          diag panel-install pnpm install --frozen-lockfile
          diag panel-build pnpm --filter @wsm/dashboard build
          diag crm-install pnpm --dir "$RUNNER_TEMP/crm-source" install --frozen-lockfile
          diag browser-install pnpm --dir "$RUNNER_TEMP/crm-source" exec playwright install --with-deps chromium
          diag crm-build pnpm --dir "$RUNNER_TEMP/crm-source" --filter @crm/web build
          cp -R "$RUNNER_TEMP/crm-source/apps/web/dist" "$RUNNER_TEMP/output/shared-offers/revisor-web-dist"
          VITE_BASE_PATH=/crm/ VITE_API_BASE=/crm/api CRM_UI_SKIN=ai-manager diag embedded-build pnpm --dir "$RUNNER_TEMP/crm-source" --filter @crm/web exec vite build --outDir "$CRM_EMBEDDED_DIST"
      - name: Check integrated CRM types and gateway contracts before acceptance
        run: |
          diag() { node "$GITHUB_WORKSPACE/scripts/crm-release/listener-diagnostic.mjs" "$RUNNER_TEMP/crm-source" "$CRM_REPORT_DIR" "$@"; }
          diag node-contracts node --test scripts/crm-release/release.test.mjs scripts/crm-release/prepare-ci-tests.test.mjs scripts/crm-release/tsx-conditions.test.mjs scripts/crm-release/listener-diagnostic.test.mjs
          cd "$RUNNER_TEMP/crm-source"
          diag request-db node --test apps/api/src/lib/request-db.node.test.mjs
          for package in @crm/api @crm/core @crm/web @crm/worker @crm/wa-port @crm/wa-gateway-rpc; do diag "type-${package#@crm/}" pnpm --filter "$package" typecheck; done
          diag wa-port pnpm --filter @crm/wa-port test
          diag wa-gateway pnpm --filter @crm/wa-gateway-rpc test
      - name: Real disposable PostgreSQL backup/restore/migrate/idempotence rehearsal
        env:
          CRM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/crm-release/listener-diagnostic.mjs "$RUNNER_TEMP/crm-source" "$CRM_REPORT_DIR" migrations pnpm --dir "$RUNNER_TEMP/crm-source" exec tsx "$GITHUB_WORKSPACE/scripts/crm-release/migration-ci.mjs" "$RUNNER_TEMP/crm-source"
      - name: Fake providers, shared administrators/offers, UI, panel SSO and read-only MCP
        run: |
          diag() { node "$GITHUB_WORKSPACE/scripts/crm-release/listener-diagnostic.mjs" "$RUNNER_TEMP/crm-source" "$CRM_REPORT_DIR" "$@"; }
          cp integrations/shared-offers/tests/operational-ci.test.ts "$RUNNER_TEMP/crm-source/tests/acceptance/T125/operational-ci.test.ts"
          cp integrations/shared-offers/tests/persistent-login-ci.test.ts "$RUNNER_TEMP/crm-source/tests/acceptance/T125/persistent-login-ci.test.ts"
          node scripts/crm-release/prepare-ci-tests.mjs prepare "$RUNNER_TEMP/crm-source"
          cd "$RUNNER_TEMP/crm-source"
          diag integration pnpm exec vitest run --config tests/acceptance/vitest.config.ts tests/acceptance/T125/shared-offers.test.ts tests/acceptance/T125/revisor-gated-ci.test.ts tests/acceptance/T125/operational-ci.test.ts --reporter=json --outputFile="$CRM_REPORT_DIR/integration.json"
          node "$GITHUB_WORKSPACE/scripts/crm-release/prepare-ci-tests.mjs" verify "$CRM_REPORT_DIR/integration.json"
          diag persistent-login pnpm exec vitest run --config tests/acceptance/vitest.config.ts tests/acceptance/T125/persistent-login-ci.test.ts --reporter=json --outputFile="$CRM_REPORT_DIR/persistent-login.json"
          node -e 'const r=require(process.argv[1]); if(r.numTotalTests!==2 || r.numPassedTests!==2 || r.numPendingTests || r.numFailedTests || !r.success) process.exit(1)' "$CRM_REPORT_DIR/persistent-login.json"
          diag mcp-offers pnpm exec vitest run --config tests/acceptance/vitest.config.ts tests/acceptance/T125/mcp-offers.test.ts --reporter=json --outputFile="$CRM_REPORT_DIR/mcp-offers.json"
          node -e 'const r=require(process.argv[1]); if(r.numTotalTests!==8 || r.numPassedTests!==8 || r.numPendingTests || r.numFailedTests || !r.success) process.exit(1)' "$CRM_REPORT_DIR/mcp-offers.json"
          diag business-areas pnpm exec vitest run --config tests/acceptance/vitest.config.ts tests/acceptance/T125/business-areas.test.ts --reporter=json --outputFile="$CRM_REPORT_DIR/business-areas.json"
          node -e 'const r=require(process.argv[1]); if(r.numTotalTests!==15 || r.numPassedTests!==15 || r.numPendingTests || r.numFailedTests || !r.success) process.exit(1)' "$CRM_REPORT_DIR/business-areas.json"
          diag core pnpm --filter @crm/core exec vitest run src/offers src/connections src/flows/engine src/flows/nodes/messaging src/flows/nodes/interactive src/flows/nodes/external src/flows/triggers src/payments/webhooks src/mcp src/mcp-oauth src/chats/ingest src/chats/send src/media src/meta-capi src/flows/nodes/pixel --maxWorkers=2 --reporter=json --outputFile="$CRM_REPORT_DIR/core.json"
          diag mcp-auth pnpm --filter @crm/api exec vitest run src/routes/mcp src/routes/mcp-oauth src/routes/connections src/routes/internal-wa-media --maxWorkers=2 --reporter=json --outputFile="$CRM_REPORT_DIR/mcp-auth.json"
          diag meta-routes pnpm --filter @crm/api exec vitest run src/routes/meta-profiles src/routes/meta-structure src/routes/meta-entities src/routes/meta-pixels --maxWorkers=2 --reporter=json --outputFile="$CRM_REPORT_DIR/meta-routes.json"
          diag worker pnpm --filter @crm/worker test
          git diff --exit-code
      - name: Verify CRM navigation, chip filter and mass dispatch in separate Playwright browser
        run: |
          diag() { node "$GITHUB_WORKSPACE/scripts/crm-release/listener-diagnostic.mjs" "$RUNNER_TEMP/crm-source" "$CRM_REPORT_DIR" "$@"; }
          cd "$RUNNER_TEMP/crm-source"
          diag web-access pnpm --filter @crm/web exec vitest run src/app/access.unit.test.ts
          diag web-recovery pnpm --filter @crm/web exec vitest run src/components/route-error.unit.test.tsx src/lib/preload-recovery.unit.test.ts
          diag d01-browser pnpm exec vitest run --config tests/acceptance/vitest.config.ts tests/acceptance/T004-D01 --reporter=json --outputFile="$CRM_REPORT_DIR/route-recovery.json"
          cp -R test-results/T004-D01 "$CRM_REPORT_DIR/T004-D01"
          diag playwright-desktop pnpm exec playwright test --config tests/acceptance/playwright.config.ts tests/acceptance/T23/shell.e2e.ts tests/acceptance/T59/ai-integrations.e2e.ts tests/acceptance/T69/chat-list.e2e.ts tests/acceptance/T83/mass-dispatch.e2e.ts --project=desktop
          diag playwright-mobile pnpm exec playwright test --config tests/acceptance/playwright.config.ts tests/acceptance/T23/shell.e2e.ts tests/acceptance/T59/ai-integrations.e2e.ts tests/acceptance/T69/chat-list.e2e.ts --project=mobile --grep 'Kanban|AC-T23-04|escolher chip|gerenciador completo'
      - name: Build immutable Alpine/musl release (never copy runner node_modules)
        run: |
          printf '.git\n**/node_modules\n**/dist\noutput\n.env\ntest-results\nplaywright-report\n**/.vite\ntests/acceptance/T125/operational-ci.test.ts\ntests/acceptance/T125/revisor-gated-ci.test.ts\ntests/acceptance/T125/persistent-login-ci.test.ts\n' > "$RUNNER_TEMP/crm-source/.dockerignore"
          docker build --platform linux/amd64 --build-arg SOURCE_TREE=964db6c2b47e33e9526d5cc890d6842ab98fdb0a -f integrations/shared-offers/Dockerfile -t "crm-shared-offers:$GITHUB_SHA" "$RUNNER_TEMP/crm-source"
          docker run --rm --network none -w /crm/apps/api "crm-shared-offers:$GITHUB_SHA" node /crm/node_modules/tsx/dist/cli.mjs --conditions=development -e "import('@crm/core').then(()=>console.log('Alpine workspace/dependencies load'))"
          docker volume create "ci_crm_${GITHUB_RUN_ID}_deps"
          docker run --rm --network none -v "ci_crm_${GITHUB_RUN_ID}_deps:/crm/node_modules:ro" "crm-shared-offers:$GITHUB_SHA" node -e "require('fs').accessSync('/crm/node_modules/tsx/dist/cli.mjs')"
      - name: Export image, CI SPA and checksummed release manifest
        run: |
          mkdir -p "$RUNNER_TEMP/crm-artifact" "$RUNNER_TEMP/ci-spa"
          docker save "crm-shared-offers:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/crm-artifact/images.tar.gz"
          cid=$(docker create "crm-shared-offers:$GITHUB_SHA")
          docker cp "$cid:/crm/apps/web/dist/." "$RUNNER_TEMP/ci-spa/"
          docker rm "$cid"
          tar -czf "$RUNNER_TEMP/crm-artifact/spa.tar.gz" -C "$RUNNER_TEMP/ci-spa" .
          node scripts/crm-release/package-ci.mjs "$RUNNER_TEMP/crm-source" "$RUNNER_TEMP/crm-artifact" "$GITHUB_SHA"
      - name: Real Nginx backend and dashboard proxy HTTP rehearsal with the packaged SPA
        env:
          CRM_SSO_SECRET: synthetic-ci-only
        run: |
          export CRM_CREDENTIALS_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")
          node scripts/crm-release/nginx-ci.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/crm-artifact" "$RUNNER_TEMP/ci-spa" "$RUNNER_TEMP/crm-source"
      - name: Verify real Compose merge and persistent next-deploy mounts
        run: |
          export CRM_SSO_SECRET=synthetic-ci-only
          export CRM_CREDENTIALS_KEY=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64'))")
          node scripts/crm-release/config-ci.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/crm-artifact" "$RUNNER_TEMP/crm-compose-state"
      - uses: actions/upload-artifact@v4
        with:
          name: crm-release-${{ github.sha }}
          path: ${{ runner.temp }}/crm-artifact/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crm-reports/
            ${{ runner.temp }}/crm-source/test-results/T004-D01/
          if-no-files-found: warn
          retention-days: 7
