name: wa-session-manager

# Portas de host parametrizadas (isolamento com `docker compose -p <projeto>`): sem container_name nem volumes
# com nome fixo. Os defaults de API_TOKEN, INTERNAL_TOKEN e CREDENTIALS_KEY são SÓ PARA DESENVOLVIMENTO:
# em qualquer ambiente real, defina valores próprios.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-wsm}:${POSTGRES_PASSWORD:-wsm}@postgres:5432/${POSTGRES_DB:-wsm}
  REDIS_URL: redis://redis:6379
  API_TOKEN: ${API_TOKEN:-dev-api-token}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  CREDENTIALS_KEY: ${CREDENTIALS_KEY:-ZGV2LW9ubHktY3JlZGVudGlhbHMta2V5LTMyYnl0ZXM=}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
  AI_MODEL_SMALL: ${AI_MODEL_SMALL:-}
  AI_MODEL_LARGE: ${AI_MODEL_LARGE:-}
  SMTP_URL: ${SMTP_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wsm}
      POSTGRES_DB: ${POSTGRES_DB:-wsm}
    # T17: portas internas só em 127.0.0.1 (não expostas na rede local); só o dashboard em todas as interfaces.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF: a fila (BullMQ) e as marcas de envio em curso sobrevivem a um restart do Redis.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
      # baileys (produção) | fake (testes E2E; expõe /internal/fake/* no servidor interno)
      WA_TRANSPORT: ${WA_TRANSPORT:-baileys}
      # real (default) | passthrough (somente testes).
      ANTIBAN_MODE: ${ANTIBAN_MODE:-real}
      ANTIBAN_PRESET: ${ANTIBAN_PRESET:-conservative}
      # Contas sem configuração de conversa entram no rodízio automático (false = só as ativadas no painel).
      CONVERSATIONS_AUTO_ROTATE: ${CONVERSATIONS_AUTO_ROTATE:-true}
      # Entrada automática em grupos: false (padrão) = só liga quando ativada no painel; true = contas novas já vêm ativas.
      GROUP_AUTOMATION_AUTO_ENABLE: ${GROUP_AUTOMATION_AUTO_ENABLE:-false}
      WORKER_HEALTH_PORT: '9464'
      WORKER_INTERNAL_PORT: '9465'
    ports:
      - '127.0.0.1:${WORKER_HEALTH_HOST_PORT:-9464}:9464'
      - '127.0.0.1:${WORKER_INTERNAL_HOST_PORT:-9465}:9465'
    # Webhooks de alerta para serviços no host (ex.: receptor de teste em host.docker.internal).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Figurinhas do aquecimento: .webp colocados em ./stickers + as recebidas (./stickers/coletadas).
    volumes:
      - ./stickers:/app/stickers
    # Graceful shutdown: a fila espera o envio em curso terminar antes de fechar as sessões.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # startObservabilityServer (T15): GET /health (db + redis) e /metrics.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9464/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      PORT: '3000'
      WORKER_INTERNAL_URL: http://worker:9465
      # T17: o nginx do dashboard sobrescreve X-Forwarded-For com o IP real do cliente (limite de login por IP).
      TRUST_PROXY: 'true'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_SESSION_TTL_MS: ${AUTH_SESSION_TTL_MS:-}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - '${DASHBOARD_HOST_PORT:-8080}:80'
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
